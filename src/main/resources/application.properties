spring.application.name=github-ai-backend
server.port=${SERVER_PORT:8080}

# PostgreSQL (docker-compose exposes PostgreSQL on localhost:5433)
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5433/githubai}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true

# GitHub OAuth — set these environment variables before starting the backend
spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID:Ov23li9bZ61FsKX4oaZB}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET:0dd34f0525717e2925ee159e6935ec4283d02fdf}
spring.security.oauth2.client.registration.github.scope=read:user,repo

# Spring AI / OpenAI
spring.ai.openai.api-key=${OPENAI_API_KEY:}
spring.ai.openai.chat.options.model=${OPENAI_CHAT_MODEL:gpt-4o-mini}
spring.ai.openai.embedding.options.model=${OPENAI_EMBEDDING_MODEL:text-embedding-3-small}

# pgvector store
spring.ai.vectorstore.pgvector.initialize-schema=true
spring.ai.vectorstore.pgvector.dimensions=1536

# Application settings required by the backend
app.frontend-url=${FRONTEND_URL:http://localhost:3000}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}
app.token-encryptor-password=${TOKEN_ENCRYPTOR_PASSWORD:githubai-token-secret-password-12345}
app.token-encryptor-salt=${TOKEN_ENCRYPTOR_SALT:5c0744940b5c369b}
app.github.api-delay-ms=${GITHUB_API_DELAY_MS:50}
app.indexing.chunk-size=${INDEXING_CHUNK_SIZE:800}
app.indexing.max-file-bytes=${INDEXING_MAX_FILE_BYTES:102400}